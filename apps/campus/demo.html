<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Lớp Học Diệu Kỳ — Chơi thử</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2b3a2f; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; }
      #menu { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(255,255,255,.94); border-radius: 14px;
        padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: min(300px, calc(100vw - 44px)); color: #3e2723; }
      #menu h1 { font-size: 15px; margin: 0 0 2px; }
      #menu p { font-size: 12px; margin: 0 0 8px; color: #6d4c41; padding-right: 18px; }
      #menu h1 { padding-right: 22px; }
      #menu .row { display: flex; flex-direction: column; gap: 6px; }
      #menu button { font: 600 14px system-ui, sans-serif; text-align: left; border: 2px solid transparent; border-radius: 10px;
        padding: 8px 10px; background: #fff3e0; color: #3e2723; cursor: pointer; min-height: 40px; }
      #menu button[aria-pressed="true"] { border-color: #ff7043; background: #ffe0b2; }
      #menu small { display: block; font-weight: 400; color: #8d6e63; font-size: 11px; }
      #menu.min .row, #menu.min p { display: none; }
      #toggle { position: absolute; top: 6px; right: 8px; border: 0; background: none; font-size: 16px; cursor: pointer; color: #6d4c41; }
      #joy { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; z-index: 10;
        background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.6); display: none; touch-action: none; }
      #knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.85); }
      @media (pointer: coarse) { #joy { display: block; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <nav id="menu" aria-label="Chọn nơi">
      <button id="toggle" type="button" aria-label="Thu gọn menu">–</button>
      <h1>Lớp Học Diệu Kỳ · chơi thử</h1>
      <p>Mũi tên / WASD, chạm hoặc bấm vào chỗ muốn đến.</p>
      <div class="row" id="places"></div>
    </nav>
    <div id="joy" aria-hidden="true"><div id="knob"></div></div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
