name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # domain: typecheck + test · classroom: validate + typecheck + test + build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
        working-directory: apps/classroom
      - run: npm run test:e2e -- --trace off
